<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Smart Closet</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js" defer></script>
    <script type="module" src="firebase.js"></script>
</head>

<body>
    <div class="container" id="auth">
        <h2>Login or Sign Up</h2>
        <form id="login-form">
            <input type="email" name="email" placeholder="Email" required />
            <input type="password" name="password" placeholder="Password" required />
            <button type="submit">Enter</button>
        </form>
    </div>

    <div class="container" id="app" style="display:none;">
        <h2>Welcome to Smart Closet</h2>
        <p>Burada kıyafetlerinizi yönetin.</p>

        <div id="add-clothing">
            <h3>Kıyafet Ekle</h3>
            <input type="text" id="item-name" placeholder="Kıyafet Adı" />
            <select id="item-clean">
                <option value="true">Temiz</option>
                <option value="false">Kirli</option>
            </select>
            <button id="save-clothing">Kaydet</button>
        </div>

        <div id="clothing-list">
            <h3>Kıyafet Listesi</h3>
            <ul id="clothes-ul"></ul>
        </div>
        <button id="logout">Çıkış Yap</button>
    </div>
</body>

</html>
